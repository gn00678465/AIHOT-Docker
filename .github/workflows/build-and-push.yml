name: Build AIHOT to Docker Hub

on:
  workflow_dispatch: # 支援在 GitHub 網頁手動點擊「Run workflow」隨時觸發
  schedule:
    - cron: '0 19 * * 0' # 每週日 UTC 19:00 (台北時間週一凌晨 03:00) 自動追蹤最新程式碼並打包

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 取得 AIHOT-Docker 自身的補丁腳本
      - name: Checkout builder repo
        uses: actions/checkout@v4
        with:
          path: builder

      # 2. 直接拉取官方上游倉庫的最新程式碼
      - name: Checkout upstream AIHOT
        uses: actions/checkout@v4
        with:
          repository: 'KKKKhazix/AIHOT'
          ref: 'main'
          path: src

      # 3. 自動套用 Anthropic Messages API 原生支援補丁
      - name: Apply Anthropic Messages API patch
        run: |
          node builder/scripts/patch-anthropic.mjs src/packages/backend/src/providers/llm.ts

      # 4. 登入 Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. 設定 Buildx (針對 x86 架構)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. 雲端打包並推送到 Docker Hub
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: src
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aihot-docker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
